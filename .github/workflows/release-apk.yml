name: Build & Release English Lesson APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify web TypeScript and Vite build
        run: |
          npm install --legacy-peer-deps
          npm run lint
          npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK 35 and NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDK_MANAGER" ]; then
            SDK_MANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install Expo app dependencies
        working-directory: mobile-expo
        run: npm install --no-audit --no-fund

      - name: Typecheck Expo app
        working-directory: mobile-expo
        run: npx tsc --noEmit

      - name: Generate native Android project with Expo Prebuild
        working-directory: mobile-expo
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: mobile-expo/android
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          cp mobile-expo/android/app/build/outputs/apk/release/app-release.apk English-Lesson.apk

      - name: Determine release tag
        id: release_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.1.0-latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: English Lesson ${{ steps.release_meta.outputs.tag }}
          files: English-Lesson.apk
          overwrite_files: true
          generate_release_notes: true
          make_latest: true
