name: Build & Release English Lesson APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Expo app dependencies
        working-directory: mobile-expo
        run: npm install

      - name: Generate native Android project with Expo Prebuild
        working-directory: mobile-expo
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: mobile-expo/android
        run: ./gradlew assembleRelease

      - name: Prepare APK artifact
        run: |
          cp mobile-expo/android/app/build/outputs/apk/release/app-release.apk English-Lesson.apk

      - name: Determine release tag
        id: release_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.1.0-latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: English Lesson ${{ steps.release_meta.outputs.tag }}
          files: English-Lesson.apk
          generate_release_notes: true
